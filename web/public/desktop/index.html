<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FactorSeal</title>
    <style>html, body { margin: 0; height: 100%; overflow: hidden; }</style>
  </head>
  <body>
    <script type="module">
      import init from "./factorseal-desktop.js";
      let active = false;
      addEventListener("pointerdown", () => (active = true), { capture: true });
      document.documentElement.addEventListener("pointerleave", () => (active = false));
      addEventListener("wheel", (event) => active || event.stopImmediatePropagation(), { capture: true, passive: true });
      await init();
      requestAnimationFrame(() => requestAnimationFrame(() => parent.postMessage("factorseal:ready", location.origin)));
    </script>
  </body>
</html>
