name: Apple credential exchange

on:
  pull_request:
    paths:
      - 'platform/apple/**'
      - 'src/transfer/**'
      - 'src/transfer.rs'
      - 'src/personal/**'
      - 'src/personal.rs'
      - 'tests/fixtures/transfer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-apple-exchange.sh'
      - '.github/workflows/apple-credential-exchange.yml'
  push:
    branches: [main]
    paths:
      - 'platform/apple/**'
      - 'src/transfer/**'
      - 'src/transfer.rs'
      - 'src/personal/**'
      - 'src/personal.rs'
      - 'tests/fixtures/transfer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-apple-exchange.sh'
      - '.github/workflows/apple-credential-exchange.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-credential-exchange-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-and-rust:
    name: Apple SDK and Rust CXF interoperability
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test credential exchange without vault or signing access
        run: bash scripts/test-apple-exchange.sh
      - name: Upload synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-credential-exchange-results
          path: platform/apple/.build/credential-exchange-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
