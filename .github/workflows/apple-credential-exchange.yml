name: Apple credential exchange

on:
  pull_request:
    paths:
      - 'platform/apple/**'
      - 'factorseal-desktop/**'
      - 'packaging/macos/**'
      - 'packaging/build-unix.sh'
      - 'scripts/*apple*'
      - 'src/transfer/**'
      - 'src/transfer.rs'
      - 'src/personal/**'
      - 'src/personal.rs'
      - 'tests/fixtures/transfer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-apple-exchange.sh'
      - '.github/workflows/apple-credential-exchange.yml'
  push:
    branches: [main]
    paths:
      - 'platform/apple/**'
      - 'factorseal-desktop/**'
      - 'packaging/macos/**'
      - 'packaging/build-unix.sh'
      - 'scripts/*apple*'
      - 'src/transfer/**'
      - 'src/transfer.rs'
      - 'src/personal/**'
      - 'src/personal.rs'
      - 'tests/fixtures/transfer/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/test-apple-exchange.sh'
      - '.github/workflows/apple-credential-exchange.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-credential-exchange-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-and-rust:
    name: Apple SDK and Rust CXF interoperability
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test credential exchange without vault or signing access
        run: bash scripts/test-apple-exchange.sh
      - name: Upload synthetic test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-credential-exchange-results
          path: platform/apple/.build/credential-exchange-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  desktop-package:
    name: Experimental Apple desktop and extension
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile Swift bridge before building the desktop
        run: xcrun swift build --package-path platform/apple --product FactorSealAppleBridge -c release -Xswiftc -warnings-as-errors
      - name: Build the experimental app without signing credentials
        env:
          FACTORSEAL_APPLE_EXCHANGE: '1'
          FACTORSEAL_BUILD_PROFILE: dev
        run: |
          env -u FACTORSEAL_MACOS_SIGNING_IDENTITY \
            -u FACTORSEAL_MACOS_PROVISIONING_PROFILE \
            -u FACTORSEAL_MACOS_EXTENSION_PROVISIONING_PROFILE \
            sh packaging/build-unix.sh macos
      - name: Verify packaged extension, native bridge, and executable
        run: bash scripts/test-apple-exchange-package.sh dist/factorseal-*-macos-*.tar.gz
      - name: Test signing profile policy
        run: python3 -m unittest discover -s scripts -p 'test_apple*.py'
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: factorseal-experimental-apple-exchange
          path: dist/*
          retention-days: 7
