name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native Linux package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Check formatting
        run: devenv shell -- cargo fmt --all -- --check
      - name: Run Clippy
        run: devenv shell -- cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: |
          devenv shell -- sh -c '
            dbus_config="$(dirname "$(command -v dbus-daemon)")/../share/dbus-1/session.conf"
            dbus-run-session --config-file "$dbus_config" -- cargo test --all-targets --all-features
          '
      - name: Check the feature combinations packagers and embedders build
        run: |
          for features in vault-client key-protection vault-store vault-store,key-protection vault-client,hardware hardware cli vault vault,cli,hardware; do
            devenv shell -- cargo check --no-default-features --features "$features"
          done
      - name: Lint packaged shell scripts
        run: devenv shell -- shellcheck packaging/build-unix.sh packaging/linux/factorseal-start
      - name: Lint packaged POSIX helpers
        run: devenv shell -- shellcheck -s sh packaging/macos/factorseal-askpass
      - name: Lint opt-in native acceptance runners
        run: devenv shell -- shellcheck acceptance/linux.sh acceptance/macos.sh
      - name: Evaluate the physical Linux acceptance app
        run: nix --extra-experimental-features 'nix-command flakes' eval --raw .#apps.x86_64-linux.acceptance-linux.program
      - name: Run NixOS vault module VM test
        run: nix --extra-experimental-features 'nix-command flakes' build --print-build-logs .#checks.x86_64-linux.nixos-module
      - name: Build and inspect Linux package
        run: |
          packaging/build-unix.sh linux
          tar -tzf dist/factorseal-*-linux-*.tar.gz | grep '/share/systemd/user/factorseal.service$'
          tar -tzf dist/factorseal-*-linux-*.tar.gz | grep '/bin/factorseal$'
          tar -tzf dist/factorseal-*-linux-*.tar.gz | grep '/run-acceptance.sh$'
      - uses: actions/upload-artifact@v4
        with:
          name: factorseal-linux
          path: dist/*

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Build and inspect macOS package
        run: |
          packaging/build-unix.sh macos
          tar -tzf dist/factorseal-*-macos-*.tar.gz | grep '/Factorseal.app/Contents/MacOS/factorseal$'
          tar -tzf dist/factorseal-*-macos-*.tar.gz | grep '/run-acceptance.sh$'
          pkgutil --payload-files dist/factorseal-*-macos-*.pkg | grep 'Applications/Factorseal.app/Contents/MacOS/factorseal$'
          plutil -lint packaging/macos/Info.plist packaging/macos/dev.factorseal.plist
      - uses: actions/upload-artifact@v4
        with:
          name: factorseal-macos
          path: dist/*

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Parse Windows helpers and acceptance runner
        shell: pwsh
        run: |
          foreach ($path in 'packaging/windows/factorseal-askpass.ps1', 'acceptance/windows.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Output $_.ToString() }; throw "$path does not parse" }
          }
      - name: Build and inspect Windows package
        shell: pwsh
        run: |
          ./packaging/build-windows.ps1
          $archive = Get-ChildItem dist/factorseal-*-windows-*.zip | Select-Object -First 1
          $entries = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            if (-not ($entries.Entries.FullName -match 'factorseal.exe$')) { throw 'Factorseal executable missing from package' }
            if (-not ($entries.Entries.FullName -match 'factorseal-task.xml.in$')) { throw 'task template missing from package' }
            if (-not ($entries.Entries.FullName -match 'run-acceptance.ps1$')) { throw 'acceptance runner missing from package' }
          } finally { $entries.Dispose() }
          [xml](Get-Content packaging/windows/factorseal-task.xml.in) | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: factorseal-windows
          path: dist/*

  mobile-core:
    name: Mobile core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-ios
          - os: macos-latest
            target: aarch64-apple-ios-sim
          - os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the portable store and injected key-protection layers
        run: cargo check --target "${{ matrix.target }}" --no-default-features --features vault-store,key-protection
