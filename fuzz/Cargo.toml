[package]
name = "factorseal-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
factorseal = { path = "..", default-features = false, features = ["fuzzing"] }

[workspace]
members = ["."]

[patch.crates-io]
i18n-config = { git = "https://github.com/kellpossible/cargo-i18n.git", rev = "9dcd77dbc62717f232815377838a2dc37f8f7f6a" }
i18n-embed = { git = "https://github.com/kellpossible/cargo-i18n.git", rev = "9dcd77dbc62717f232815377838a2dc37f8f7f6a" }
i18n-embed-impl = { git = "https://github.com/kellpossible/cargo-i18n.git", rev = "9dcd77dbc62717f232815377838a2dc37f8f7f6a" }
i18n-embed-fl = { git = "https://github.com/kellpossible/cargo-i18n.git", rev = "9dcd77dbc62717f232815377838a2dc37f8f7f6a" }

[[bin]]
name = "personal_sync"
path = "fuzz_targets/personal_sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed-corpus"
path = "src/seed.rs"
test = false
doc = false
bench = false

