# Temporary compatibility exceptions, NOT ignored vulnerabilities. The checker
# permits only this exact package/version and informational advisory, until expiry.
# Reviewed 2026-10-13 with cargo-audit 0.22.2 after patching quinn-proto.
# No vulnerabilities were reported; the five remaining findings are maintenance
# warnings. Keep this review window to 30 days while migrating their parents.
# Desktop adds four of these dependencies; paste also comes through native sync.
# Reviewed 2026-10-18 with cargo-audit 0.22.2: no vulnerabilities or yanked
# crates. Three new maintenance warnings require a coordinated zbus 6 migration
# in Factorseal and its Desktop parents; their separate 30-day window ends below.

[[exception]]
id = "RUSTSEC-2025-0141"
package = "bincode"
version = "1.3.3"
owner = "Factorseal maintainers"
reviewed = 2026-10-13
expires = 2026-11-12
reason = "GPUI CE component base enables syntect's embedded syntax assets, serialized with bincode; changing formats requires rebuilding the parent assets."
migration = "DEP-1: feature-gate unused highlighting in gpui-base, or migrate syntect and its assets together."

