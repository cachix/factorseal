# Temporary compatibility exceptions, NOT ignored vulnerabilities. The checker
# permits only this exact package/version and informational advisory, until expiry.
# Baseline reviewed 2026-10-13; zbus helper advisories reviewed 2026-10-18,
# both with cargo-audit 0.22.2. No vulnerabilities were reported; the six
# findings are maintenance warnings. Keep the existing 2026-11-12 expiry
# while migrating their parents. Desktop, native sync, and D-Bus use these crates.

[[exception]]
id = "RUSTSEC-2025-0141"
package = "bincode"
version = "1.3.3"
owner = "Factorseal maintainers"
reviewed = 2026-10-13
expires = 2026-11-12
reason = "GPUI CE component base enables syntect's embedded syntax assets, serialized with bincode; changing formats requires rebuilding the parent assets."
migration = "DEP-1: feature-gate unused highlighting in gpui-base, or migrate syntect and its assets together."

[[exception]]
id = "RUSTSEC-2024-0436"
package = "paste"
version = "1.0.15"
owner = "Factorseal maintainers"
reviewed = 2026-10-13
expires = 2026-11-12
reason = "Compile-time macro dependency of Metal, netlink-packet-core, pulp, and rav1e; all parents must migrate to remove it across platforms."
migration = "DEP-3: migrate Metal, netlink-packet-core, pulp, and rav1e to maintained macro support such as pastey; check Linux, Windows, and macOS builds."

[[exception]]
id = "RUSTSEC-2026-0192"
package = "ttf-parser"
version = "0.25.1"
owner = "Factorseal maintainers"
reviewed = 2026-10-13
expires = 2026-11-12
reason = "fontdb 0.23, used by the component SVG renderer, still uses this parser. A direct Cargo version override cannot replace its APIs."
migration = "DEP-6: migrate fontdb and the component SVG renderer together to maintained font parsing and validate font fallback, accessibility, and every enabled renderer."

# Factorseal, Desktop, shared ashpd 0.13, and gpui-tray use zbus 6.
# GPUI CE's oo7 0.6, accessibility, ashpd 0.11 via rfd, and notification parents still use zbus 5
# and its standalone helpers. See docs/development.md for the remaining DEP-7 migration paths.
[[exception]]
id = "RUSTSEC-2026-0370"
package = "zvariant"
version = "5.15.0"
owner = "Factorseal maintainers"
reviewed = 2026-10-18
expires = 2026-11-12
reason = "Standalone zvariant moved into zbus 6's wire module. The pinned zbus 5, AT-SPI, and zbus-lockstep parents still require its existing API."
migration = "DEP-7: direct callers, shared ashpd 0.13, and gpui-tray use zbus 6; migrate oo7, AT-SPI/accesskit, ashpd 0.11 through rfd, notify-rust, and zbus-lockstep next; validate portals, tray, keyring, and accessibility on native targets."

[[exception]]
id = "RUSTSEC-2026-0371"
package = "zbus_names"
version = "4.3.4"
owner = "Factorseal maintainers"
reviewed = 2026-10-18
expires = 2026-11-12
reason = "Standalone zbus_names moved into zbus 6's names module. The pinned zbus 5, AT-SPI, zbus_macros, and zbus_xml parents still require its existing API."
migration = "DEP-7: direct callers use zbus 6's names module; migrate desktop D-Bus parents, including AT-SPI and zbus-lockstep's XML tooling, then validate native D-Bus integration and accessibility."

[[exception]]
id = "RUSTSEC-2026-0372"
package = "zvariant_derive"
version = "5.15.0"
owner = "Factorseal maintainers"
reviewed = 2026-10-18
expires = 2026-11-12
reason = "Standalone zvariant_derive macros moved into zbus 6. The zvariant 5 dependency shared by the pinned zbus 5 and desktop D-Bus parents still requires these derives."
migration = "DEP-7: direct callers use zbus 6 macros; replace remaining desktop parents' zvariant 5 derives with zbus 6 macros and validate native protocol serialization and D-Bus integration."
