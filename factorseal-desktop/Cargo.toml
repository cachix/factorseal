[package]
name = "factorseal-desktop"
description = "FactorSeal desktop application"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/factorseal"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
factorseal = { path = "..", default-features = false, features = ["vault-client", "key-protection", "transfer"] }
fs2 = "0.4.3"
gpui = "=0.2.2"
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "39c2c86dbee7" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "39c2c86dbee7" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git" }
gpui-tray = { path = "../crates/gpui-tray" }
rfd = { version = "0.15.4", default-features = false, features = ["async-std", "xdg-portal"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
native-theme = "=0.5.7"
tempfile = "3.23"
toml = "1.1"
smol = "2.0"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
dbus = "0.9.12"
detect-desktop-environment = "=1.3.0"
futures-util = "0.3"
native-theme-gtk = "=0.1.1"
native-theme-qt = "=0.1.0"
notify = "=8.2.0"
xdg = "=3.0.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
