[package]
name = "factorseal-desktop"
description = "FactorSeal desktop application"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/factorseal"
publish = false

[dependencies]
anyhow = "1.0"
bip39 = { version = "2.2", features = ["zeroize"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
factorseal = { path = "..", default-features = false, features = ["vault-client", "key-protection", "transfer", "secret-service-host", "diagnostics", "personal-sync-network"] }
fs2 = "0.4.3"
gethostname = "1.1.0"
getrandom = "0.3.3"
gpui = { package = "gpui-ce", git = "https://github.com/gpui-ce/gpui-ce.git", rev = "05d89e953701a89fedac9b17b3042154bdf74afe" }
# CE's component fork with the current platform/deferred API compatibility fixes.
gpui-component = { package = "gpui_ce_components", git = "https://github.com/domenkozar/gpui-kit.git", rev = "c7440f24e3c392beefe759aeb7989bd4ea4ffd4e" }
gpui-component-assets = { package = "gpui_ce_components_assets", git = "https://github.com/domenkozar/gpui-kit.git", rev = "c7440f24e3c392beefe759aeb7989bd4ea4ffd4e" }
gpui_platform = { package = "gpui_ce_platform", git = "https://github.com/gpui-ce/gpui-ce.git", rev = "05d89e953701a89fedac9b17b3042154bdf74afe", features = ["font-kit", "x11", "wayland"] }
gpui-tray = { version = "=0.1.1", git = "https://github.com/domenkozar/gpui-tray.git", rev = "db57d965a7187563644c5028bb1a17d36486b919", default-features = false, features = ["gpui-ce", "menu-state"] }
rfd = { version = "0.15.4", default-features = false, features = ["async-std", "xdg-portal"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
native-theme = "=0.5.7"
tempfile = "3.23"
toml = "1.1"
smol = "2.0"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["async-io", "settings"] }
dbus = "0.9.12"
detect-desktop-environment = "=1.3.0"
futures-util = "0.3"
native-theme-gtk = "=0.1.1"
native-theme-qt = "=0.1.0"
notify = "=8.2.0"
xdg = "=3.0.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
