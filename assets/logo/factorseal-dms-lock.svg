<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 160 160"
     role="img"
     aria-labelledby="title description">
  <title id="title">FactorSeal</title>
  <desc id="description">A filled DMS-style CPU containing the original FactorSeal keyhole.</desc>

  <defs>
    <mask id="keyhole-cutout">
      <rect width="160" height="160" fill="#fff"/>
      <circle cx="80" cy="68" r="13" fill="#000"/>
      <path d="M75 78 69 108h22L85 78Z" fill="#000"/>
    </mask>
  </defs>

  <g fill="currentColor" mask="url(#keyhole-cutout)">
    <!-- Filled version of the DMS CPU's square, softly rounded body. -->
    <rect x="34" y="34" width="92" height="92" rx="14"/>

    <!-- DMS pin placement and soft terminal shape. -->
    <rect x="60" y="19" width="12" height="17" rx="5"/>
    <rect x="88" y="19" width="12" height="17" rx="5"/>
    <rect x="60" y="124" width="12" height="17" rx="5"/>
    <rect x="88" y="124" width="12" height="17" rx="5"/>
    <rect x="19" y="60" width="17" height="12" rx="5"/>
    <rect x="19" y="88" width="17" height="12" rx="5"/>
    <rect x="124" y="60" width="17" height="12" rx="5"/>
    <rect x="124" y="88" width="17" height="12" rx="5"/>
  </g>
</svg>
