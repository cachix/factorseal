<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="form-action 'none'"><title>FactorSeal login test</title>
<style>body{font:18px system-ui;max-width:32rem;margin:4rem auto;padding:0 1rem}label,input,button{display:block;margin:1rem 0}input{box-sizing:border-box;padding:.5rem;width:min(100%,20rem)}</style>
<h1>FactorSeal login test</h1><p>Use test credentials such as review@example.com and a throwaway password.</p>
<form method="post" onsubmit="event.preventDefault()"><label>Username<input name="username" autocomplete="username"></label><label>Password<input name="password" type="password" autocomplete="current-password"></label><button type="submit">Submit test login</button></form>
<p>Submission stays on this page; no credentials are sent to a server.</p>
</html>
