[package]
name = "factorseal"
description = "A hardware-bound vault with a keyring interface and command-line access"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/factorseal"

[workspace]
members = ["crates/hardwareseal", "crates/secret-service-protocol"]
resolver = "2"

[features]
default = ["vault", "cli", "hardware", "secretspec-provider"]
vault-client = ["dep:interprocess"]
vault-store = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:automerge",
    "dep:fs2",
    "dep:getrandom_04",
    "dep:ghash",
    "dep:hmac",
    "dep:ml-dsa",
    "dep:polyval",
    "dep:tokio",
    "dep:turso",
]
# The legacy full desktop vault feature remains the default and retains its
# public API. Mobile embedders use `vault-store` + `key-protection` instead.
vault = [
    "vault-client",
    "vault-store",
    "dep:block2",
    "dep:ctrlc",
    "dep:dbus",
    "dep:secret-service-protocol",
    "dep:zbus",
    "dep:nix",
    "dep:nt-token",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:sysinfo",
    "dep:widestring",
    "dep:windows",
]
cli = ["dep:clap", "dep:directories", "dep:rpassword"]
secretspec-provider = [
    "dep:async-trait",
    "dep:percent-encoding",
    "dep:secretspec-ipc",
    "tokio/io-std",
    "tokio/macros",
]
# Portable key nesting and injected key protection. This deliberately does not
# select the desktop-only `hardwareseal` adapter.
key-protection = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:argon2",
    "dep:ghash",
    "dep:ml-dsa",
    "dep:nt-token",
    "dep:pbkdf2",
    "dep:polyval",
    "dep:windows",
]
hardware = ["key-protection", "dep:hardwareseal"]

[[bin]]
name = "factorseal"
path = "src/bin/factorseal.rs"
required-features = ["vault", "cli", "hardware"]

[dependencies]
# `aes-gcm` does not forward `zeroize` to its dependencies. The `aes`, `ghash`,
# and `polyval` entries exist only to wipe the expanded key schedule and the
# GHASH authentication key when a cipher instance is dropped.
aes = { version = "0.8.4", features = ["zeroize"], optional = true }
aes-gcm = { version = "0.10.3", features = ["zeroize"], optional = true }
argon2 = { version = "0.5.3", optional = true }
async-trait = { version = "0.1.89", optional = true }
automerge = { version = "0.11.0", optional = true }
base64 = "0.22.1"
clap = { version = "4.5.41", features = ["derive", "env"], optional = true }
ctrlc = { version = "3.5.1", features = ["termination"], optional = true }
directories = { version = "6.0.0", optional = true }
getrandom = "0.3.3"
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["sys_rng"], optional = true }
ghash = { version = "0.5.1", features = ["zeroize"], optional = true }
fs2 = { version = "0.4.3", optional = true }
hardwareseal = { version = "0.1.0", path = "crates/hardwareseal", features = ["apple"], optional = true }
hex = "0.4.3"
hmac = { version = "0.12.1", optional = true }
ml-dsa = { version = "0.1.1", features = ["zeroize"], optional = true }
percent-encoding = { version = "2.3.2", optional = true }
polyval = { version = "0.6.2", features = ["zeroize"], optional = true }
pbkdf2 = { version = "0.12.2", optional = true }
rpassword = { version = "7.4.0", optional = true }
secretspec-ipc = { git = "https://github.com/cachix/secretspec.git", rev = "8adfdb4815889d4739af4f92cebf1537e5d30ef8", package = "secretspec-ipc", optional = true }
secret-service-protocol = { path = "crates/secret-service-protocol", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["rt", "sync", "time"], optional = true }
turso = { version = "0.8.0-pre.4", default-features = false, optional = true }
zeroize = "1.8.1"

[dev-dependencies]
tempfile = "3.20.0"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", optional = true }
zbus = { version = "5.14.0", default-features = false, features = ["tokio"], optional = true }
nix = { version = "0.31.3", features = ["socket", "user"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
nix = { version = "0.31.3", features = ["socket", "user"], optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "block2"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSNotification", "NSOperation", "NSRunLoop", "NSString", "block2"], optional = true }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = { version = "2.4.2", optional = true }
nt-token = { version = "0.5.0", optional = true }
sysinfo = { version = "0.37.2", default-features = false, features = ["system"], optional = true }
widestring = { version = "1.2.1", optional = true }
windows = { version = "0.61.3", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"

[profile.test]
debug = 0
