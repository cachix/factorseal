[package]
name = "hardwareseal"
description = "Minimal, fail-closed hardware-backed secret sealing"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/domenkozar/factorseal"

[features]
default = []
apple = ["dep:security-framework", "dep:security-framework-sys"]
android = ["dep:jni", "dep:ndk-context"]

[dependencies]
# `aes-gcm` does not forward `zeroize` to its dependencies. The `aes`, `ghash`,
# and `polyval` entries exist only to wipe the expanded key schedule and the
# GHASH authentication key when a cipher instance is dropped.
aes = { version = "0.8.4", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
base64 = "0.22.1"
getrandom = "0.3.3"
ghash = { version = "0.5.1", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
zeroize = "1.8.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "3.7.0", features = ["OSX_10_15"], optional = true }
security-framework-sys = { version = "2.17.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_TpmBaseServices",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", optional = true }
ndk-context = { version = "0.1.1", optional = true }

[dev-dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
    "Win32_System_TpmBaseServices",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
